<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Kompre Bersama</title>
<style>
  :root {
    --paper: #F7F3EA;
    --paper-line: #E1D9C6;
    --ink: #1F3A52;
    --ink-soft: #4A5F70;
    --accent: #B8622E;
    --correct: #2F6B4F;
    --correct-bg: #E5EFE7;
    --wrong: #A6392F;
    --wrong-bg: #F5E6E2;
    --unanswered: #C99A2E;
    --unanswered-bg: #FBF1D9;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  body {
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .pages {
    display: flex;
    width: 200%;
    height: 100vh;
    transition: transform 0.5s cubic-bezier(.65,0,.35,1);
  }
  .pages.on-quiz { transform: translateX(-50%); }
  .page {
    width: 50%;
    height: 100vh;
    overflow-y: auto;
    flex-shrink: 0;
  }

  /* ---------- COVER PAGE ---------- */
  #coverPage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    position: relative;
  }
  .cover-compass {
    width: 64px; height: 64px;
    margin-bottom: 28px;
    opacity: 0.9;
  }
  #coverPage h1 {
    font-size: 2.6rem;
    margin: 0 0 10px;
    letter-spacing: 0.3px;
    font-weight: 600;
    line-height: 1.2;
    max-width: 600px;
  }
  #coverPage .subtitle {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.95rem;
    color: var(--ink-soft);
    margin: 0 0 40px;
  }
  .btn-start {
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 14px 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-start:hover { background: #16283a; }
  .swipe-hint {
    position: absolute;
    bottom: 34px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.75rem;
    color: var(--ink-soft);
    opacity: 0.7;
  }
  .byline {
    position: absolute;
    bottom: 68px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.82rem;
    color: var(--ink-soft);
    letter-spacing: 0.2px;
  }

  /* ---------- QUIZ PAGE ---------- */
  #quizPage { padding: 22px 20px 40px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  header.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
    margin-bottom: 16px;
    gap: 12px;
  }
  header.quiz-header h1 {
    font-size: 1.3rem;
    margin: 0;
    font-weight: 600;
  }
  .back-link {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
  }

  .stats-row {
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    gap: 18px;
    align-items: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    background: #fff;
    border: 1px solid var(--paper-line);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.green { background: var(--correct); }
  .dot.red { background: var(--wrong); }
  .dot.yellow { background: var(--unanswered); }

  .nav-panel {
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 20px;
  }
  .nav-panel-label {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: none;
  }
  .nav-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 6px;
    max-height: 168px;
    overflow-y: auto;
    padding-right: 2px;
  }
  .nav-btn {
    font-family: "Helvetica Neue", Arial, sans-serif;
    width: 34px; height: 34px;
    border-radius: 3px;
    border: 1.5px solid var(--paper-line);
    background: var(--unanswered-bg);
    color: var(--ink);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn.st-yellow { background: var(--unanswered-bg); border-color: var(--unanswered); color: #6b4f10; }
  .nav-btn.st-green  { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
  .nav-btn.st-red    { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }
  .nav-btn.current { outline: 2px solid var(--ink); outline-offset: 1px; }

  .card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 26px 24px 20px;
  }
  .soal {
    font-size: 1.08rem;
    line-height: 1.55;
    margin: 0 0 20px;
  }
  .options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .option {
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 12px 14px;
    cursor: pointer;
    background: #FFFEFC;
    transition: border-color 0.15s ease, background 0.15s ease;
    font-size: 0.95rem;
    line-height: 1.45;
  }
  .option:hover:not(.locked) { border-color: var(--ink); background: #FBF9F4; }
  .option .letter {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 600; color: var(--ink-soft);
  }
  .option.correct { background: var(--correct-bg); border-color: var(--correct); }
  .option.correct .letter { background: var(--correct); border-color: var(--correct); color: #fff; }
  .option.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
  .option.wrong .letter { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .option.locked { cursor: default; }
  .option.dim { opacity: 0.55; }

  .feedback {
    margin-top: 18px;
    padding: 15px 17px;
    border-radius: 3px;
    display: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.88rem;
    line-height: 1.6;
  }
  .feedback.show { display: block; }
  .feedback.is-correct { background: var(--correct-bg); border-left: 3px solid var(--correct); }
  .feedback.is-wrong { background: var(--wrong-bg); border-left: 3px solid var(--wrong); }
  .feedback .verdict { font-family: Georgia, serif; font-weight: 700; font-size: 0.98rem; margin-bottom: 6px; }
  .feedback.is-correct .verdict { color: var(--correct); }
  .feedback.is-wrong .verdict { color: var(--wrong); }
  .feedback .pembahasan-label { color: var(--ink-soft); font-size: 0.76rem; margin-top: 8px; margin-bottom: 3px; }
  .feedback .no-pemb { color: var(--ink-soft); font-style: italic; }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  button.nav-arrow {
    font-family: inherit;
    font-size: 0.88rem;
    border: 1.5px solid var(--ink);
    cursor: pointer;
    border-radius: 3px;
    padding: 10px 18px;
    font-weight: 600;
    background: transparent;
    color: var(--ink);
  }
  button.nav-arrow:disabled { opacity: 0.3; cursor: default; }
  button.nav-arrow.primary { background: var(--ink); color: var(--paper); }

  @media (max-width: 480px) {
    #quizPage { padding: 16px 12px 30px; }
    .card { padding: 20px 15px 16px; }
    #coverPage h1 { font-size: 1.9rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  .option:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>

<div class="pages" id="pagesWrap">

  <!-- COVER PAGE -->
  <section class="page" id="coverPage">
    <svg class="cover-compass" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" stroke="#1F3A52" stroke-width="1.2"/>
      <path d="M20 4 L23 20 L20 36 L17 20 Z" fill="#B8622E" opacity="0.85"/>
      <circle cx="20" cy="20" r="2" fill="#1F3A52"/>
    </svg>
    <h1>Belajar Kompre Bersama</h1>
    <p class="subtitle">Latihan soal ujian komprehensif &middot; PWK UGM</p>
    <button class="btn-start" id="startBtn">Mulai mengerjakan &rarr;</button>
    <div class="byline">Dibuat oleh M Farel Zulkhar Firmansyah</div>
    <div class="swipe-hint">Geser ke kiri atau klik tombol untuk mulai</div>

  <!-- QUIZ PAGE -->
  <section class="page" id="quizPage">

      <header class="quiz-header">
        <h1>Belajar Kompre Bersama</h1>
        <button class="back-link" id="backBtn">&larr; kembali ke sampul</button>

      <div class="stats-row">
        <span id="counter">Soal 1 dari 201</span>

        <span class="stat-pill"><span class="dot yellow"></span> Belum: <b id="scoreUnanswered">201</b></span>
      </div>

      <div class="nav-panel">
        <div class="nav-panel-label">Urutan soal &mdash; klik untuk lompat langsung</div>
        <div class="nav-grid" id="navGrid"></div>
      </div>

      <div class="card">
        <div class="soal" id="soalText"></div>
        <ul class="options" id="optionsList"></ul>
        <div class="feedback" id="feedback">
          <div class="verdict" id="verdict"></div>
          <div class="pembahasan-label">Pembahasan</div>
          <div class="pembahasan-body" id="pembBody"></div>
        </div>
      </div>

      <div class="controls">
        <button class="nav-arrow" id="prevBtn">&larr; Sebelumnya</button>
        <button class="nav-arrow primary" id="nextBtn">Berikutnya &rarr;</button>
      </div>
    </div>
  </section>

</div>

, {"no": 4, "soal": "Dalam Teori Tempat Sentral Walter Christaller susunan hirarki K=3 dikenal sebagai prinsip...", "options": [{"letter": "a", "text": "Pemasaran (Marketing principle)"}, {"letter": "b", "text": "Lalu Lintas (Transport principle)"}, {"letter": "c", "text": "Administrasi (Administrative principle)"}, {"letter": "d", "text": "Industri (Industrial principle)"}, {"letter": "e", "text": "Ekologi (Ecological principle)"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Hirarki K=3 melayani 1/3 bagian dari kawasan sekitarnya yang berfokus pada efisiensi pemasaran barang/jasa."}, {"no": 5, "soal": "Menurut Walter Christaller hirarki tempat sentral K=4 dirancang untuk mengoptimalkan efisiensi dalam aspek...", "options": [{"letter": "a", "text": "Pemasaran"}, {"letter": "b", "text": "Lalu Lintas dan Transportasi"}, {"letter": "c", "text": "Pemerintahan dan Administrasi"}, {"letter": "d", "text": "Konservasi Lingkungan"}, {"letter": "e", "text": "Pendidikan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Hirarki K=4 (Transport Principle) memberikan rute transportasi paling efisien menghubungkan pusat-pusat kegiatan."}, {"no": 6, "soal": "Hirarki tempat sentral K=7 menurut Christaller mengintegrasikan seluruh wilayah bawahan secara penuh untuk kepentingan...", "options": [{"letter": "a", "text": "Pemasaran"}, {"letter": "b", "text": "Sistem Transportasi"}, {"letter": "c", "text": "Administrasi Pemerintahan"}, {"letter": "d", "text": "Kawasan Industri"}, {"letter": "e", "text": "Kawasan Lindung"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Hirarki K=7 (Administrative Principle) mencakup seluruh wilayah bawahan di bawah kontrol administrasi pemerintahan tunggal."}, {"no": 7, "soal": "Konsep Kutub Pertumbuhan (Growth Pole Theory) yang dirumuskan oleh Francois Perroux menekankan pertumbuhan ekonomi wilayah berbasis pada...", "options": [{"letter": "a", "text": "Sektor pertanian perdesaan"}, {"letter": "b", "text": "Industri pendorong (propulsive industry n kawasan kaya dan miskin"}, {"letter": "e", "text": "Membangun kota di atas permukaan laut"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Garden City memadukan kesempatan kerja perkotaan dan lingkungan asri perdesaan dengan pembatasan populasi."}, {"no": 11, "soal": "Frank Lloyd Wright memperkenalkan konsep kota masa depan yang berbasis ketergantungan kendaraan pribadi dan alokasi lahan luas per keluarga yang dinamakan...", "options": [{"letter": "a", "text": "Garden City"}, {"letter": "b", "text": "Radiant City"}, {"letter": "c", "text": "Broadacre City"}, {"letter": "d", "text": "Linear City"}, {"letter": "e", "text": "Compact City"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Broadacre City mengusulkan pemukiman berdensitas sangat rendah di mana setiap keluarga memiliki lahan minimal 1 ekar dan mobil."}, {"no": 12, "soal": "Gagasan kota vertikal dengan gedung pencakar langit yang dikelilingi taman terbuka hijau karya Le Corbusier dikenal dengan nama...", "options": [{"letter": "a", "text": "Ville Radieuse (Radiant City)"}, {"letter": "b", "text": "Broadacre City"}, {"letter": "c", "text": "Garden City"}, {"letter": "d", "text": "Industrial City"}, {"letter": "e", "text": "Ecocity"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Radiant City (Le Corbusier) mengusulkan gedung-gedung tinggi berkepadatan tinggi untuk menyisakan mayoritas permukaan tanah sebagai RTH."}, {"no": 13, "soal": "Konsep kota linear yang dirancang memanjang sejajar koridor jaringan transportasi masal dikembangkan oleh...", "options": [{"letter": "a", "text": "Ebenezer Howard"}, {"letter": "b", "text": "Arturo Soria y Mata"}, {"letter": "c", "text": "Le Corbusier"}, {"letter": "d", "text": "Patrick Geddes"}, {"letter": "e", "text": "Jane Jacobs"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Arturo Soria y Mata merancang Linear City dengan struktur memanjang sepanjang jalur trem/kereta api."}, {"no": 14, "soal": "Bapak Perencanaan Ekologis yang memelopori metode analisis kesesuaian lahan berbasis penumpangsusunan (overlay) peta tematik dalam buku Design with Nature adalah...", "options": [{"letter": "a", "text": "Patrick Geddes"}, {"letter": "b", "text": "Ian McHarg"}, {"letter": "c", "text": "Lewis Mumford"}, {"letter": "d", "text": "Aldo Leopold"}, {"letter": "e", "text": "Rachel Carson"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Ian McHarg mengagitasi analisis ekologi kuantitatif menggunakan penumpangsusunan peta transparansi yang menjadi dasar GIS."}, {"no": 15, "soal": "Kevin Lynch dalam buku The Image of the City merumuskan 5 elemen pembentuk citra kota mencakup...", "options": [{"letter": "a", "text": "Jalan Gedung Taman Lapangan Sungai"}, {"letter": "b", "text": "Path Edge District Node Landmark"}, {"letter": "c", "text": "Pusat Pinggiran Industri Hunian Pasar"}, {"letter": "d", "text": "KDB KLB GSB KDH KTN"}, {"letter": "e", "text": "Arteri Kolektor Lokal Lingkungan Tol"}], "correct": "b", "pembahasan": "Jawaban B BENAR: 5 elemen citra kota Kevin Lynch adalah Path (jalur), Edge (tepian), District (kawasan), Node (simpul), dan Landmark (penanda)."}, {"no": 16, "soal": "Pendekatan perancangan kota karya Gordon Cullen yang menekankan pada persepsi visual urutan pemandangan pejalan kaki dikenal dengan istilah...", "options": [{"letter": "a", "text": "The Image of the City"}, {"letter": "b", "text": "Serial Vision (The Concise Townscape)"}, {"letter": "c", "text": "Eyes on the Street"}, {"letter": "d", "text": "Design with Nature"}, {"letter": "e", "text": "Responsive Environments"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Gordon Cullen memperkenalkan Serial Vision dalam buku The Concise Townscape untuk memetakan pengalaman visual ruang kota."}, {"no": 17, "soal": "Tokoh kritis yang menentang perancangan kota modernisme dan mengagungkan kepadatan fungsi serta mata di jalan (eyes on the street) adalah...", "options": [{"letter": "a", "text": "Le Corbusier"}, {"letter": "b", "text": "Jane Jacobs"}, {"letter": "c", "text": "Ebenezer Howard"}, {"letter": "d", "text": "Robert Moses"}, {"letter": "e", "text": "Homer Hoyt"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Jane Jacobs dalam The Death and Life of Great American Cities menekankan vitalitas trotoar dan keanekaragaman penggunaan lahan."}, {"no": 18, "soal": "Undang-Undang Republik Indonesia yang menjadi landasan utama penyelenggaraan Penataan Ruang adalah...", "options": [{"letter": "a", "text": "UU No. 32 Tahun 2009"}, {"letter": "b", "text": "UU No. 26 Tahun 2007"}, {"letter": "c", "text": "UU No. 1 Tahun 2011"}, {"letter": "d", "text": "UU No. 38 Tahun 2004"}, {"letter": "e", "text": "UU No. 41 Tahun 2009"}], "correct": "b", "pembahasan": "Jawaban B BENAR: UU No. 26 Tahun 2007 tentang Penataan Ruang mengatur kerangka hukum tata ruang di Indonesia."}, {"no": 19, "soal": "Penyelarasan kebijakan penataan ruang dan integrasi perizinan berusaha pasca-penetapan regulasi Cipta Kerja diatur dalam...", "options": [{"letter": "a", "text": "UU No. 26 Tahun 2007"}, {"letter": "b", "text": "UU No. 6 Tahun 2023 / UU No. 11 Tahun 2020"}, {"letter": "c", "text": "UU No. 32 Tahun 2009"}, {"letter": "d", "text": "UU No. 23 Tahun 2014"}, {"letter": "e", "text": "UU No. 17 Tahun 2007"}], "correct": "b", "pembahasan": "Jawaban B BENAR: UU Cipta Kerja mereformasi perizinan tata ruang terintegrasi melalui Kesesuaian Kegiatan Pemanfaatan Ruang (KKPR)."}, {"no": 20, "soal": "Urutan hierarki Rencana Tata Ruang di Indonesia dari tingkat tertinggi hingga terinci adalah...", "options": [{"letter": "a", "text": "RDTR -> RTRW Kab -> RTRW Prov -> RTRWN"}, {"letter": "b", "text": "RTRWN -> RTRW Provinsi -> RTRW Kabupaten/Kota -> RDTR"}, {"letter": "c", "text": "RTRW Prov -> RTRWN -> RDTR -> RTRW Kab"}, {"letter": "d", "text": "RDTR -> RTRWN -> RTRW Prov -> RTRW Kab"}, {"letter": "e", "text": "RTRW Kab -> RDTR -> RTRW Prov -> RTRWN"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Hirarki RTRW berjenjang dari Nasional (RTRWN), Provinsi, Kabupaten/Kota, hingga Detail (RDTR)."}, {"no": 21, "soal": "Dokumen Rencana Tata Ruang Wilayah (RTRW) Kabupaten/Kota berlaku untuk jangka waktu...", "options": [{"letter": "a", "text": "5 tahun"}, {"letter": "b", "text": "10 tahun"}, {"letter": "c", "text": "15 tahun"}, {"letter": "d", "text": "20 tahun"}, {"letter": "e", "text": "25 tahun"}], "correct": "d", "pembahasan": "Jawaban D BENAR: RTRW berlaku selama 20 tahun dan ditinjau kembali setiap 5 tahun sekali."}, {"no": 22, "soal": "Tingkat ketelitian skala peta operasional yang wajib digunakan dalam penyusunan Rencana Detail Tata Ruang (RDTR) adalah...", "options": [{"letter": "a", "text": "1 : 250.000"}, {"letter": "b", "text": "1 : 50.000"}, {"letter": "c", "text": "1 : 25.000"}, {"letter": "d", "text": "1 : 5.000"}, {"letter": "e", "text": "1 : 1.000"}], "correct": "d", "pembahasan": "Jawaban D BENAR: RDTR wajib memiliki tingkat ketelitian peta skala minimal 1:5.000."}, {"no": 23, "soal": "Skala peta rencana yang digunakan dalam dokumen RTRW Kabupaten adalah...", "options": [{"letter": "a", "text": "1 : 250.000"}, {"letter": "b", "text": "1 : 100.000"}, {"letter": "c", "text": "1 : 50.000"}, {"letter": "d", "text": "1 : 5.000"}, {"letter": "e", "text": "1 : 1.000"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Peta RTRW Kabupaten disusun dengan tingkat ketelitian skala 1:50.000."}, {"no": 24, "soal": "Skala peta rencana yang digunakan dalam dokumen RTRW Provinsi adalah...", "options": [{"letter": "a", "text": "1 : 500.000"}, {"letter": "b", "text": "1 : 250.000"}, {"letter": "c", "text": "1 : 50.000"}, {"letter": "d", "text": "1 : 25.000"}, {"letter": "e", "text": "1 : 5.000"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Peta RTRW Provinsi disusun dengan tingkat ketelitian skala 1:250.000."}, {"no": 25, "soal": "Dokumen persetujuan dari pemerintah yang menyatakan kesesuaian antara rencana kegiatan pemanfaatan ruang dengan RTR dinamakan...", "options": [{"letter": "a", "text": "AMDAL"}, {"letter": "b", "text": "KKPR (Kesesuaian Kegiatan Pemanfaatan Ruang)"}, {"letter": "c", "text": "Izin Mendirikan Bangunan (IMB)"}, {"letter": "d", "text": "Sertifikat Laik Fungsi (SLF)"}, {"letter": "e", "text": "SPPL"}], "correct": "b", "pembahasan": "Jawaban B BENAR: KKPR merupakan dokumen acuan utama dasar perizinan berusaha pengganti izin lokasi."}, {"no": 26, "soal": "Sesuai UU No. 26 Tahun 2007 proporsi Ruang Terbuka Hijau (RTH) minimal pada wilayah kota adalah sebesar...", "options": [{"letter": "a", "text": "10% total wilayah"}, {"letter": "b", "text": "20% total wilayah"}, {"letter": "c", "text": "30% total wilayah (20% publik & 10% privat)"}, {"letter": "d", "text": "40% total wilayah"}, {"letter": "e", "text": "50% total wilayah"}], "correct": "c", "pembahasan": "Jawaban C BENAR: UU 26/2007 mengamanatkan total RTH kota minimal 30% yang terdiri dari 20% RTH Publik dan 10% RTH Privat."}, {"no": 27, "soal": "Jika sebuah kota memiliki luas wilayah 10.000 ha berapa luas minimal RTH Publik yang wajib disediakan oleh pemerintah kota?", "options": [{"letter": "a", "text": "1.000 ha"}, {"letter": "b", "text": "1.500 ha"}, {"letter": "c", "text": "2.000 ha"}, {"letter": "d", "text": "3.000 ha"}, {"letter": "e", "text": "4.000 ha"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Luas RTH Publik minimal 20% dari total luas kota. 20% x 10.000 ha = 2.000 ha."}, {"no": 28, "soal": "Kepadatan penduduk yang dihitung dengan membagi jumlah penduduk dengan luas khusus kawasan permukiman/perumahan dinamakan...", "options": [{"letter": "a", "text": "Kepadatan Bruto"}, {"letter": "b", "text": "Kepadatan Agraris"}, {"letter": "c", "text": "Kepadatan Netto"}, {"letter": "d", "text": "Kepadatan Fisiologis"}, {"letter": "e", "text": "Kepadatan Geografis"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Kepadatan Netto membagi jumlah jiwa khusus terhadap luas lahan fungsi permukiman saja."}, {"no": 29, "soal": "Kepadatan penduduk yang dihitung dari total jumlah penduduk dibagi total luas seluruh wilayah dinamakan...", "options": [{"letter": "a", "text": "Kepadatan Bruto (Gross Density)"}, {"letter": "b", "text": "Kepadatan Netto (Net Density)"}, {"letter": "c", "text": "Kepadatan Bangunan"}, {"letter": "d", "text": "Kepadatan Tenaga Kerja"}, {"letter": "e", "text": "Kepadatan Kamar"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Kepadatan Bruto membagi populasi total dengan total luas wilayah tanpa membedakan guna lahan."}, {"no": 30, "soal": "Suatu wilayah berpenduduk 40.000 jiwa memiliki luas total 100 ha dan luas kawasan permukiman 50 ha. Berapakah Kepadatan Penduduk Netto wilayah tersebut?", "options": [{"letter": "a", "text": "400 jiwa/ha"}, {"letter": "b", "text": "500 jiwa/ha"}, {"letter": "c", "text": "800 jiwa/ha"}, {"letter": "d", "text": "1.000 jiwa/ha"}, {"letter": "e", "text": "2.000 jiwa/ha"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Kepadatan Netto = 40.000 jiwa / 50 ha = 800 jiwa/ha."}, {"no": 31, "soal": "Rumus analisis Location Quotient (LQ) untuk menentukan sektor basis daerah adalah...", "options": [{"letter": "a", "text": "(e_i * e) / (E_i * E)"}, {"letter": "b", "text": "(e_i / e) / (E_i / E)"}, {"letter": "c", "text": "(E_i / e_i) / (E / e)"}, {"letter": "d", "text": "(e / E) * (e_i / E_i)"}, {"letter": "e", "text": "(e_i - e) / (E_i - E)"}], "correct": "b", "pembahasan": "Jawaban B BENAR: LQ membandingkan porsi sektor i di daerah (e_i/e) terhadap porsi sektor i di nasional (E_i/E)."}, {"no": 32, "soal": "Jika nilai Location Quotient (LQ) suatu sektor ekonomi bernilai lebih besar dari 1 (LQ > 1) maka sektor tersebut tergolong...", "options": [{"letter": "a", "text": "Sektor non-basis"}, {"letter": "b", "text": "Sektor basis (mampu memenuhi kebutuhan lokal dan mengeksport keluar)"}, {"letter": "c", "text": "Sektor terbelakang"}, {"letter": "d", "text": "Sektor tidak berkembang"}, {"letter": "e", "text": "Sektor impor"}], "correct": "b", "pembahasan": "Jawaban B BENAR: LQ > 1 mengindikasikan sektor tersebut memiliki keunggulan pemenuhan lokal dan mengekspor."}, {"no": 33, "soal": "Sektor i daerah menyerap 400 dari 2.000 tenaga kerja. Di nasional sektor i menyerap 10.000 dari 100.000 tenaga kerja. Berapakah nilai LQ?", "options": [{"letter": "a", "text": "0.5"}, {"letter": "b", "text": "1.0"}, {"letter": "c", "text": "1.5"}, {"letter": "d", "text": "2.0"}, {"letter": "e", "text": "2.5"}], "correct": "d", "pembahasan": "Jawaban D BENAR: LQ = (400/2000) / (10000/100000) = 0.20 / 0.10 = 2.0."}, {"no": 34, "soal": "Komponen Differential Shift (C) dalam analisis Shift-Share mengukur...", "options": [{"letter": "a", "text": "Pertumbuhan ekonomi nasional"}, {"letter": "b", "text": "Bauran industri nasional"}, {"letter": "c", "text": "Daya saing relatif komoditas/sektor daerah dibandingkan nasional"}, {"letter": "d", "text": "Tingkat inflasi daerah"}, {"letter": "e", "text": "Jumlah pengangguran"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Differential Shift (Competitive Effect) mengukur keunggulan kompetitif lokal suatu sektor."}, {"no": 35, "soal": "Komponen Industrial Mix (M) dalam analisis Shift-Share mencerminkan...", "options": [{"letter": "a", "text": "Daya saing komoditas lokal"}, {"letter": "b", "text": "Pengaruh struktur pertumbuhan sektor tersebut di tingkat nasional"}, {"letter": "c", "text": "Kepadatan penduduk"}, {"letter": "d", "text": "Pendapatan per kapita"}, {"letter": "e", "text": "Luas wilayah"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Industrial Mix mengukur dampak komposisi sektor industri nasional terhadap pertumbuhan daerah."}, {"no": 36, "soal": "Model Gravitasi Interaksi (Newton) menyatakan bahwa kekuatan interaksi antar dua kota berbanding...", "options": [{"letter": "a", "text": "Lurus dengan jarak dan terbalik dengan populasi"}, {"letter": "b", "text": "Lurus dengan perkalian populasi dan terbalik dengan kuadrat jarak"}, {"letter": "c", "text": "Terbalik dengan perkalian populasi dan lurus dengan jarak"}, {"letter": "d", "text": "Lurus dengan luas wilayah semata"}, {"letter": "e", "text": "Terbalik dengan jumlah industri"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Interaksi berbanding lurus dengan produk populasi kedua kota dan berbanding terbalik dengan kuadrat jarak."}, {"no": 37, "soal": "Kota P (10.000 jiwa) dan Kota Q (40.000 jiwa) berjarak 20 km (k=1). Berapakah kekuatan interaksi gravitasi kedua kota?", "options": [{"letter": "a", "text": "500000"}, {"letter": "b", "text": "1000000"}, {"letter": "c", "text": "2000000"}, {"letter": "d", "text": "5000000"}, {"letter": "e", "text": "10000000"}], "correct": "b", "pembahasan": "Jawaban B BENAR: I = (10.000 x 40.000) / (20^2) = 400.000.000 / 400 = 1.000.000."}, {"no": 38, "soal": "Formula Hukum Titik Henti Reilly untuk menentukan batas area interaksi dari kota yang lebih kecil (B) adalah...", "options": [{"letter": "a", "text": "d / (1 + (P_A / P_B))"}, {"letter": "b", "text": "d / (1 + sqrt(P_A / P_B))"}, {"letter": "c", "text": "sqrt(d) / (P_A / P_B)"}, {"letter": "d", "text": "(P_A * P_B) / d^2"}, {"letter": "e", "text": "d * (P_A / P_B)"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Titik Henti D_B = d / (1 + sqrt(P_A / P_B)) dihitung dari lokasi berpopulasi lebih kecil."}, {"no": 39, "soal": "Kota A berpenduduk 36.000 jiwa dan Kota B berpenduduk 4.000 jiwa. Jarak A-B adalah 28 km. Lokasi titik henti dihitung dari Kota B adalah...", "options": [{"letter": "a", "text": "5 km"}, {"letter": "b", "text": "7 km"}, {"letter": "c", "text": "14 km"}, {"letter": "d", "text": "21 km"}, {"letter": "e", "text": "24 km"}], "correct": "b", "pembahasan": "Jawaban B BENAR: D_B = 28 / (1 + sqrt(36.000/4.000)) = 28 / (1 + 3) = 7 km dari Kota B."}, {"no": 40, "soal": "Indeks Aksesibilitas Beta (Kansky) dihitung dengan membagi...", "options": [{"letter": "a", "text": "Jumlah simpul dengan jumlah ruas"}, {"letter": "b", "text": "Jumlah ruas/sisi jalan (e) dengan jumlah simpul/kota (v)"}, {"letter": "c", "text": "Jumlah kendaraan dengan panjang jalan"}, {"letter": "d", "text": "Luas wilayah dengan panjang jalan"}, {"letter": "e", "text": "Jumlah penduduk dengan jumlah jalan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Indeks Beta = e / v mengukur tingkat konektivitas jaringan transportasi."}, {"no": 41, "soal": "Suatu wilayah memiliki jaringan jalan dengan 15 ruas jalan (e) dan 10 simpul kota (v). Nilai Indeks Beta wilayah tersebut adalah...", "options": [{"letter": "a", "text": "0.66"}, {"letter": "b", "text": "1.00"}, {"letter": "c", "text": "1.50"}, {"letter": "d", "text": "2.00"}, {"letter": "e", "text": "2.50"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Indeks Beta = 15 / 10 = 1,50."}, {"no": 42, "soal": "Angka Beban Ketergantungan (Dependency Ratio) dihitung dari rasio...", "options": [{"letter": "a", "text": "(Penduduk Produktif / Total Penduduk) * 100%"}, {"letter": "b", "text": "(Penduduk Non-Produktif [0-14 & >=65] / Penduduk Produktif [15-64]) * 100%"}, {"letter": "c", "text": "(Penduduk Bekerja / Pengangguran) * 100%"}, {"letter": "d", "text": "(Penduduk Pria / Penduduk Wanita) * 100%"}, {"letter": "e", "text": "(Jumlah Bayi / Jumlah Lansia) * 100%"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Dependency ratio membandingkan populasi usia non-produktif terhadap populasi produktif."}, {"no": 43, "soal": "Jika penduduk usia non-produktif sebanyak 5.000 jiwa dan penduduk usia produktif sebanyak 10.000 jiwa berapakah Dependency Ratio?", "options": [{"letter": "a", "text": "0.25"}, {"letter": "b", "text": "0.5"}, {"letter": "c", "text": "0.75"}, {"letter": "d", "text": "1"}, {"letter": "e", "text": "2"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Dependency Ratio = (5.000 / 10.000) x 100% = 50%."}, {"no": 44, "soal": "Formula proyeksi penduduk metode Aritmatika adalah...", "options": [{"letter": "a", "text": "Pt = P0 * (1 + r * t)"}, {"letter": "b", "text": "Pt = P0 * (1 + r)^t"}, {"letter": "c", "text": "Pt = P0 * e^(r*t)"}, {"letter": "d", "text": "Pt = P0 + (r / t)"}, {"letter": "e", "text": "Pt = P0 * r * t"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Proyeksi aritmatika mengasumsikan pertambahan jumlah penduduk yang konstan setiap tahun."}, {"no": 45, "soal": "Jumlah penduduk awal 50.000 jiwa dengan laju pertumbuhan aritmatika 2% per tahun (r=0,02). Proyeksi penduduk setelah 10 tahun (t=10) adalah...", "options": [{"letter": "a", "text": "55.000 jiwa"}, {"letter": "b", "text": "58.000 jiwa"}, {"letter": "c", "text": "60.000 jiwa"}, {"letter": "d", "text": "65.000 jiwa"}, {"letter": "e", "text": "70.000 jiwa"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Pt = 50.000 x (1 + 0,02 x 10) = 50.000 x 1,20 = 60.000 jiwa."}, {"no": 46, "soal": "Koefisien Dasar Bangunan (KDB) adalah angka persentase perbandingan antara...", "options": [{"letter": "a", "text": "Luas lantai dasar bangunan dengan luas persil/tapak tanah"}, {"letter": "b", "text": "Total luas seluruh lantai dengan luas tapak tanah"}, {"letter": "c", "text": "Luas RTH dengan luas persil"}, {"letter": "d", "text": "Tinggi bangunan dengan lebar jalan"}, {"letter": "e", "text": "Luas basement dengan luas tapak"}], "correct": "a", "pembahasan": "Jawaban A BENAR: KDB membatasi persentase area lantai dasar yang boleh tertutup bangunan pada suatu persil."}, {"no": 47, "soal": "Suatu tapak tanah luasnya 1.000 m2. Bangunan lantai dasar yang didirikan seluas 500 m2. Nilai KDB persil tersebut adalah...", "options": [{"letter": "a", "text": "0.25"}, {"letter": "b", "text": "0.4"}, {"letter": "c", "text": "0.5"}, {"letter": "d", "text": "0.6"}, {"letter": "e", "text": "0.8"}], "correct": "c", "pembahasan": "Jawaban C BENAR: KDB = (500 / 1.000) x 100% = 50%."}, {"no": 48, "soal": "Koefisien Lantai Bangunan (KLB) adalah angka rasio perbandingan antara...", "options": [{"letter": "a", "text": "Luas lantai dasar dengan luas tapak"}, {"letter": "b", "text": "Total luas seluruh lantai bangunan dengan luas persil/tapak tanah"}, {"letter": "c", "text": "Luas RTH dengan luas lahan"}, {"letter": "d", "text": "Tingg h Penduduk / Luas Permukiman = 30.000 / 60 = 500 jiwa/ha."}, {"no": 123, "soal": "Dalam analisis Shift-Share komponen yang mengukur daya saing komoditas/sektor lokal dibandingkan dengan sektor yang sama di tingkat nasional dinamakan...", "options": [{"letter": "a", "text": "National Growth Effect (N)"}, {"letter": "b", "text": "Industrial Mix Effect (M)"}, {"letter": "c", "text": "Differential Shift / Competitive Effect (C)"}, {"letter": "d", "text": "Multiplier Effect"}, {"letter": "e", "text": "Location Quotient"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Differential Shift (C) menunjukkan keunggulan komparatif/daya saing spesifik sektor di daerah."}, {"no": 124, "soal": "Prinsip tata kelola air perkotaan yang mewajibkan setiap pembangunan tidak boleh meningkatkan debit puncak air permukaan ke saluran drainase kota disebut...", "options": [{"letter": "a", "text": "Runoff Coefficient"}, {"letter": "b", "text": "Zero Delta Q Policy"}, {"letter": "c", "text": "Water Sensitivity Index"}, {"letter": "d", "text": "Ecological Footprint"}, {"letter": "e", "text": "Infiltration Rate"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Zero Delta Q Policy menetapkan bahwa debit limpasan air keluar dari tapak setelah terbangun harus sama dengan nol."}, {"no": 125, "soal": "Kota A berpenduduk 40.000 jiwa dan Kota B berpenduduk 10.000 jiwa. Jarak A-B adalah 30 km. Lokasi titik henti (break-even point) interaksi perdagangan dari Kota B adalah...", "options": [{"letter": "a", "text": "5 km"}, {"letter": "b", "text": "10 km"}, {"letter": "c", "text": "15 km"}, {"letter": "d", "text": "20 km"}, {"letter": "e", "text": "25 km"}], "correct": "b", "pembahasan": "Jawaban B BENAR: D_B = 30 / (1 + sqrt(40.000 / 10.000)) = 30 / (1 + 2) = 10 km dari Kota B."}, {"no": 126, "soal": "Fenomena wilayah perbatasan peri-urban di Asia Tenggara yang mencirikan percampuran intensif antara kegiatan pertanian dan non-pertanian dinamakan oleh Terry McGee sebagai...", "options": [{"letter": "a", "text": "Conurbation"}, {"letter": "b", "text": "Megalopolis"}, {"letter": "c", "text": "Desakota Zone"}, {"letter": "d", "text": "Central Place"}, {"letter": "e", "text": "Metropolitan Mainstream"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Konsep Desakota menggambarkan wilayah transisi desa-kota yang dinamis dengan aksesibilitas tinggi dan guna lahan campuran."}, {"no": 127, "soal": "Konsep perencanaan kota ramah lingkungan yang memfokuskan pemanenan air hujan perkolasi alami dan pemanfaatan lahan basah buatan untuk mencegah banjir dinamakan...", "options": [{"letter": "a", "text": "Compact City"}, {"letter": "b", "text": "Sponge City"}, {"letter": "c", "text": "Broadacre City"}, {"letter": "d", "text": "Linear City"}, {"letter": "e", "text": "Techno City"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Sponge City merancang kawasan perkotaan agar menyerap menyimpan dan menyaring air hujan layaknya busa/spons alami."}, {"no": 128, "soal": "Instrumen perencanaan lingkungan yang wajib disusun untuk menilai daya dukung dan daya tampung lingkungan hidup dalam penyusunan RTRW adalah...", "options": [{"letter": "a", "text": "AMDAL"}, {"letter": "b", "text": "UKL-UPL"}, {"letter": "c", "text": "KLHS (Kajian Lingkungan Hidup Strategis)"}, {"letter": "d", "text": "SPPL"}, {"letter": "e", "text": "AMDAL Lalu Lintas"}], "correct": "c", "pembahasan": "Jawaban C BENAR: KLHS merupakan analisis sistematis yang wajib diintegrasikan ke dalam penyusunan dokumen Rencana Tata Ruang (RTRW/RDTR)."}, {"no": 129, "soal": "Dalam analisis GIS operasi overlay yang memotong layer input berdasarkan batas (boundary) dari layer pemotong tanpa menggabungkan atribut dinamakan...", "options": [{"letter": "a", "text": "Union"}, {"letter": "b", "text": "Intersect"}, {"letter": "c", "text": "Clip"}, {"letter": "d", "text": "Buffer"}, {"letter": "e", "text": "Erase"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Clip memotong fitur layer input sesuai area geometris layer clipper tanpa m ext": "UU No. 11 Tahun 2020 / UU No. 6 Tahun 2023"}, {"letter": "c", "text": "UU No. 32 Tahun 2009"}, {"letter": "d", "text": "Permen ATR No. 1 Tahun 2018"}, {"letter": "e", "text": "UU No. 1 Tahun 2011"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Regulasi Cipta Kerja mengintegrasikan RZWP-3-K ke dalam RTRW Provinsi untuk mewujudkan satu kesatuan tata ruang darat dan laut."}, {"no": 134, "soal": "Istilah yang menggambarkan kenaikan suhu udara di area pusat perkotaan yang signifikan lebih tinggi dibandingkan area perdesaan di sekitarnya disebut...", "options": [{"letter": "a", "text": "Global Warming"}, {"letter": "b", "text": "Greenhouse Effect"}, {"letter": "c", "text": "Urban Heat Island (UHI)"}, {"letter": "d", "text": "Thermal Inversion"}, {"letter": "e", "text": "Microclimate Shift"}], "correct": "c", "pembahasan": "Jawaban C BENAR: UHI terjadi akibat dominasi permukaan kedap air hilangnya vegetasi dan akumulasi panas dari aktivitas antropogenik di perkotaan."}, {"no": 135, "soal": "Dalam perancangan transportasi kota jalur khusus kendaraan non-motor seperti sepeda dan pejalan kaki dikenal dengan istilah moda...", "options": [{"letter": "a", "text": "Motorized Transport"}, {"letter": "b", "text": "Non-Motorized Transport (NMT)"}, {"letter": "c", "text": "Paratransit"}, {"letter": "d", "text": "Rapid Transit"}, {"letter": "e", "text": "Feeder System"}], "correct": "b", "pembahasan": "Jawaban B BENAR: NMT mencakup moda transportasi ramah lingkungan tanpa mesin seperti berjalan kaki sepeda dan kursi roda."}, {"no": 136, "soal": "Menurut Permen ATR/BPN No. 11 Tahun 2021 jangka waktu masa berlaku Rencana Detail Tata Ruang (RDTR) adalah...", "options": [{"letter": "a", "text": "5 tahun"}, {"letter": "b", "text": "10 tahun"}, {"letter": "c", "text": "20 tahun"}, {"letter": "d", "text": "25 tahun"}, {"letter": "e", "text": "30 tahun"}], "correct": "c", "pembahasan": "Jawaban C BENAR: RDTR berlaku dalam jangka waktu 20 tahun dan dapat ditinjau kembali 1 kali dala olitan"}, {"letter": "b", "text": "Megalopolis / Conurbation"}, {"letter": "c", "text": "Metropolitan Small"}, {"letter": "d", "text": "Rural Area"}, {"letter": "e", "text": "Township"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Megalopolis (Jean Gottmann) atau konurbasi adalah megastruktur perkotaan yang terbentuk dari gabungan beberapa jaringan metropolitan."}, {"no": 141, "soal": "Menurut Model Gravitasi Newton jika Kota X (P_i = 20.000) dan Kota Y (P_j = 50.000) berjarak 10 km (k=1) berapakah nilai kekuatan interaksinya?", "options": [{"letter": "a", "text": "1000000"}, {"letter": "b", "text": "5000000"}, {"letter": "c", "text": "10000000"}, {"letter": "d", "text": "100000000"}, {"letter": "e", "text": "1000000000"}], "correct": "c", "pembahasan": "Jawaban C BENAR: I_xy = 1 x (20.000 x 50.000) / 10^2 = 1.000.000.000 / 100 = 10.000.000."}, {"no": 142, "soal": "Menurut Friedmann dalam Core-Periphery Model tahap pembangunan di mana wilayah inti (core) mendominasi dan menyerap sumber daya dari wilayah pinggiran (periphery) disebut...", "options": [{"letter": "a", "text": "Pre-industrial stage"}, {"letter": "b", "text": "Transitional / Core-Periphery stage"}, {"letter": "c", "text": "Industrial stage"}, {"letter": "d", "text": "Post-industrial stage"}, {"letter": "e", "text": "Integrated space stage"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Tahap II (Transitional) dicirikan oleh kemunculan satu pusat ekonomi dominan (core) yang mengeksploitasi hinterland-nya (periphery)."}, {"no": 143, "soal": "Penanganan atau perbaikan pemukiman kumuh yang dilakukan langsung di lokasi asal tanpa melakukan pemindahan warga dinamakan...", "options": [{"letter": "a", "text": "Penanganan Ex-situ"}, {"letter": "b", "text": "Penanganan In-situ"}, {"letter": "c", "text": "Relokasi Total"}, {"letter": "d", "text": "Transmigrasi"}, {"letter": "e", "text": "Land Clearance"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Penanganan in-situ memperbaiki kualitas fisik dan prasarana lingkungan langsung di lokasi tapak permukiman awal."}, {"no": 144, "soal": "Dalam analisis kualitatif perencanaan metode pengumpulan pendapat para ahli secara terstruktur dan berulang (multitahap) tanpa tatap muka langsung dinamakan...", "options": [{"letter": "a", "text": "Metode Regresi"}, {"letter": "b", "text": "Metode Delphi"}, {"letter": "c", "text": "Metode AHP"}, {"letter": "d", "text": "Metode SWOT"}, {"letter": "e", "text": "Metode Cost-Benefit"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Metode Delphi mengumpulkan konsensus pandangan pakar melalui beberapa putaran kuesioner secara anonim."}, {"no": 145, "soal": "Sesuai UU No. 38 Tahun 2004 tentang Jalan jalan umum yang melayani angkutan utama dengan ciri perjalanan jarak jauh kecepatan rata-rata tinggi dan jumlah jalan masuk dibatasi adalah...", "options": [{"letter": "a", "text": "Jalan Kolektor"}, {"letter": "b", "text": "Jalan Lokal"}, {"letter": "c", "text": "Jalan Arteri"}, {"letter": "d", "text": "Jalan Lingkungan"}, {"letter": "e", "text": "Jalan Tol Khusus"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Jalan Arteri melayani angkutan jarak jauh dengan kecepatan tinggi dan pembatasan akses jalan masuk."}, {"no": 146, "soal": "Suatu persil tanah berluas 1.200 m2 memiliki bangunan dengan luas tapak lantai dasar 600 m2. Berapakah nilai Koefisien Dasar Bangunan (KDB) persil tersebut?", "options": [{"letter": "a", "text": "0.25"}, {"letter": "b", "text": "0.4"}, {"letter": "c", "text": "0.5"}, {"letter": "d", "text": "0.6"}, {"letter": "e", "text": "0.75"}], "correct": "c", "pembahasan": "Jawaban C BENAR: KDB = (Luas Lantai Dasar / Luas Lahan) x 100% = (600 / 1.200) x 100% = 50%."}, {"no": 147, "soal": "Komponen analisis daya dukung lingkungan hidup yang mengukur batas maksimum populasi yang dapat didukung oleh ketersediaan air bersih di suatu wilayah dinamakan...", "options": [{"letter": "a", "text": "Ecological Footprint"}, {"letter": "b", "text": "Water Carrying Capacity"}, {"letter": "c", "text": "Air Quality Index"}, {"letter": "d", "text": "Soil Infiltration Rate"}, {"letter": "e", "text": "Runoff Coefficient"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Daya dukung air (Water Carrying Capacity) mengukur keseimbangan antara ketersediaan pasokan air bersih dan proyeksi kebutuhan air penduduk."}, {"no": 148, "soal": "Dalam Teori Kansky jaringan transportasi dengan 12 sisi/ruas jalan (e) dan 8 simpul/kota (v) memiliki nilai Indeks Aksesibilitas Beta (beta = e / v) sebesar...", "options": [{"letter": "a", "text": "0.66"}, {"letter": "b", "text": "1.00"}, {"letter": "c", "text": "1.25"}, {"letter": "d", "text": "1.50"}, {"letter": "e", "text": "2.00"}], "correct": "d", "pembahasan": "Jawaban D BENAR: beta = e / v = 12 / 8 = 1,50. Nilai beta > 1 menunjukkan tingkat konektivitas jaringan jalan yang baik."}, {"no": 149, "soal": "Kawasan Pertanian Pangan Berkelanjutan (LP2B) diatur dalam regulasi nasional untuk mencegah alih fungsi lahan primer. Regulasi yang dimaksud adalah...", "options": [{"letter": "a", "text": "UU No. 26 Tahun 2007"}, {"letter": "b", "text": "UU No. 41 Tahun 2009"}, {"letter": "c", "text": "UU No. 32 Tahun 2009"}, {"letter": "d", "text": "UU No. 1 Tahun 2011"}, {"letter": "e", "text": "UU No. 39 Tahun 2009"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Perlindungan Lahan Pertanian Pangan Berkelanjutan (LP2B) diatur secara spesifik dalam UU No. 41 Tahun 2009."}, {"no": 150, "soal": "Proses penataan ruang terbuka publik yang berfokus pada penguatan identitas lokal kenyamanan interaksi sosial dan keterikatan emosional warga dinamakan...", "options": [{"letter": "a", "text": "Zoning Control"}, {"letter": "b", "text": "Placemaking"}, {"letter": "c", "text": "Gentrification"}, {"letter": "d", "text": "Urban Sprawl"}, {"letter": "e", "text": "Urban Renewal"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Placemaking mengartikulasikan desain ruang publik untuk menciptakan tempat (place) yang hidup dan memiliki makna sosial-budaya."}, {"no": 151, "soal": "Kurva statistik yang menggambarkan tingkat ketimpangan akumulatif distribusi pendapatan penduduk suatu negara/wilayah dinamakan...", "options": [{"letter": "a", "text": "Kurva Kuznets"}, {"letter": "b", "text": "Kurva Lorenz"}, {"letter": "c", "text": "Kurva Offer"}, {"letter": "d", "text": "Kurva Phillips"}, {"letter": "e", "text": "Kurva Indiferensi"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Kurva Lorenz memetakan persentase kumulatif pendapatan terhadap persentase kumulatif populasi untuk menghitung Koefisien Gini."}, {"no": 152, "soal": "Dalam manajemen risiko bencana tingkat Risiko Bencana (R) dirumuskan sebagai perkalian antara Bahaya (H) dan Kerentanan (V) dibagi oleh Kapasitas (C). Jika H=0.8 V=0.6 dan C=0.4 berapakah nilai R?", "options": [{"letter": "a", "text": "0.32"}, {"letter": "b", "text": "0.48"}, {"letter": "c", "text": "0.80"}, {"letter": "d", "text": "1.20"}, {"letter": "e", "text": "1.92"}], "correct": "d", "pembahasan": "Jawaban D BENAR: R = (H x V) / C = (0,8 x 0,6) / 0,4 = 0,48 / 0,4 = 1,20."}, {"no": 153, "soal": "Dampak negatif dari aktivitas ekonomi suatu pihak yang merugikan masyarakat atau lingkungan tanpa adanya kompensasi finansial disebut...", "options": [{"letter": "a", "text": "Positive Externality"}, {"letter": "b", "text": "Negative Externality"}, {"letter": "c", "text": "Internal Economies"}, {"letter": "d", "text": "Multiplier Effect"}, {"letter": "e", "text": "Opportunity Cost"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Eksternalitas negatif terjadi saat kegiatan produksi/konsumsi menimbulkan biaya sosial (seperti polusi) pada pihak ketiga."}, {"no": 154, "soal": "Hak atas tanah yang memberikan kewenangan untuk mendirikan dan mempunyai bangunan di atas tanah yang bukan miliknya sendiri dinamakan...", "options": [{"letter": "a", "text": "Hak Milik"}, {"letter": "b", "text": "Hak Guna Bangunan (HGB)"}, {"letter": "c", "text": "Hak Pakai"}, {"letter": "d", "text": "Hak Guna Usaha (HGU)"}, {"letter": "e", "text": "Hak Sewa"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Hak Guna Bangunan (HGB) membolehkan pemegangnya mendirikan dan memiliki bangunan di atas tanah negara atau tanah hak milik orang lain."}, {"no": 155, "soal": "Model matematis pemilihan moda transportasi yang menghitung probabilitas pengguna memilih moda A atau B berdasarkan selisih utilitas dinamakan...", "options": [{"letter": "a", "text": "Model Regresi Linier"}, {"letter": "b", "text": "Model Logit Binomial"}, {"letter": "c", "text": "Model Garin-Lowry"}, {"letter": "d", "text": "Model Gravitasi"}, {"letter": "e", "text": "Model Markov Chain"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Model Logit Binomial memodelkan pilihan biner antar-dua moda transportasi berdasarkan perbedaan utilitas masing-masing moda."}, {"no": 156, "soal": "Kawasan Strategis Nasional (KSN) ditetapkan berdasarkan kriteria yang memiliki pengaruh sangat penting secara nasional terhadap aspek-aspek berikut kecuali...", "options": [{"letter": "a", "text": "Kedaulatan negara dan pertahanan keamanan"}, {"letter": "b", "text": "Ekonomi nasional"}, {"letter": "c", "text": "Sosial budaya"}, {"letter": "d", "text": "Lingkungan hidup"}, {"letter": "e", "text": "Penetapan tarif pajak bumi lokal"}], "correct": "e", "pembahasan": "Jawaban E BENAR: KSN ditetapkan berdasarkan aspek Hankam ekonomi sosbud dan/atau lingkungan; penetapan pajak lokal bukan kriteria KSN."}, {"no": 157, "soal": "Indeks komposit yang diukur dari tiga dimensi utama: umur panjang & sehat pengetahuan/pendidikan dan standar hidup layak dinamakan...", "options": [{"letter": "a", "text": "Indeks Gini"}, {"letter": "b", "text": "Indeks Pembangunan Manusia (IPM / HDI)"}, {"letter": "c", "text": "Indeks Williamson"}, {"letter": "d", "text": "Indeks Kebahagiaan"}, {"letter": "e", "text": "Indeks Ketahanan Pangan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: IPM (Human Development Index) mengukur pencapaian pembangunan manusia berbasis kesehatan pendidikan dan pengeluaran per kapita."}, {"no": 158, "soal": "Pendekatan penataan kawasan kota yang mengintegrasikan jalur pejalan kaki transportasi masal perumahan dan area komersial secara padat dinamakan...", "options": [{"letter": "a", "text": "Compact City"}, {"letter": "b", "text": "Sub-urbanization"}, {"letter": "c", "text": "Leapfrog City"}, {"letter": "d", "text": "Car-Centric City"}, {"letter": "e", "text": "Ribbon City"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Compact City mempromosikan pemanfaatan ruang kota berkepadatan tinggi guna lahan campuran dan efisiensi transportasi publik."}, {"no": 159, "soal": "Dalam dokumen tata ruang aturan hukum yang mengatur tentang ketentuan guna lahan intensitas bangunan dan tata bangunan pada setiap blok dinamakan...", "options": [{"letter": "a", "text": "Rencana Pembangunan"}, {"letter": "b", "text": "Peraturan Zonasi (Zoning Regulation)"}, {"letter": "c", "text": "AMDAL"}, {"letter": "d", "text": "Surat Izin Usaha"}, {"letter": "e", "text": "Dokumen Evaluasi"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Peraturan Zonasi merupakan instrumen kendali pemanfaatan ruang yang mengatur persil/blok peruntukan secara terperinci."}, {"no": 160, "soal": "Konsep pengembangan kawasan perdesaan yang didukung simpul agribisnis dan sarana perkotaan guna mencegah migrasi berlebih ke kota besar disebut...", "options": [{"letter": "a", "text": "Agropolitan"}, {"letter": "b", "text": "Technopolis"}, {"letter": "c", "text": "Megalopolis"}, {"letter": "d", "text": "Metropolitan"}, {"letter": "e", "text": "Sub-urban"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Agropolitan memperkuat ekonomi perdesaan berbasis pertanian terpadu agar memiliki fasilitas pelayanan setara kota."}, {"no": 161, "soal": "Konsep Transit Oriented Development (TOD) menempatkan kawasan hunian komersial dan fasilitas publik pada jarak tempuh pejalan kaki dari simpul transit utama. Prinsip utamanya adalah...", "options": [{"letter": "a", "text": "Memaksimalkan penggunaan mobil pribadi"}, {"letter": "b", "text": "Menciptakan kawasan padat guna lahan campuran (mixed-use) dan ramah pejalan kaki"}, {"letter": "c", "text": "Memindahkan stasiun transit ke luar kota"}, {"letter": "d", "text": "Melarang pembangunan gedung bertingkat"}, {"letter": "e", "text": "Menghilangkan fasilitas umum"}], "correct": "b", "pembahasan": "Jawaban B BENAR: TOD mengintegrasikan guna lahan padat dan campuran di sekitar simpul transit masal untuk mengurangi ketergantungan kendaraan pribadi."}, {"no": 162, "soal": "Suatu kota memiliki luas wilayah 5.000 ha. Menurut UU No. 26 Tahun 2007 berapakah luas minimal Ruang Terbuka Hijau (RTH) Publik yang wajib disediakan oleh pemerintah kota?", "options": [{"letter": "a", "text": "500 ha"}, {"letter": "b", "text": "1.000 ha"}, {"letter": "c", "text": "1.500 ha"}, {"letter": "d", "text": "2.000 ha"}, {"letter": "e", "text": "2.500 ha"}], "correct": "b", "pembahasan": "Jawaban B BENAR: UU 26/2007 mengamanatkan RTH Publik minimal 20% dari luas wilayah kota. 20% x 5.000 ha = 1.000 ha."}, {"no": 163, "soal": "Sesuai UU No. 1 Tahun 2011 tentang Perumahan dan Kawasan Permukiman rumah yang tidak memenuhi standar keselamatan bangunan kecukupan luas dan kesehatan penghuni dikategori sebagai...", "options": [{"letter": "a", "text": "Rumah Mewah"}, {"letter": "b", "text": "Rumah Tidak Layak Huni (RTLH)"}, {"letter": "c", "text": "Rumah Deret"}, {"letter": "d", "text": "Rumah Susun Komersial"}, {"letter": "e", "text": "Rumah Adat"}], "correct": "b", "pembahasan": "Jawaban B BENAR: RTLH adalah rumah yang tidak memenuhi persyaratan keselamatan bangunan kecukupan minimum luas bangunan dan kesehatan penghuni."}, {"no": 164, "soal": "Dalam struktur ruang wilayah kawasan yang ditetapkan dengan fungsi utama melestarikan lingkungan hidup dan sumber daya alam dinamakan...", "options": [{"letter": "a", "text": "Kawasan Budidaya"}, {"letter": "b", "text": "Kawasan Lindung"}, {"letter": "c", "text": "Kawasan Industri"}, {"letter": "d", "text": "Kawasan Strategis Ekonomi"}, {"letter": "e", "text": "Kawasan Komersial"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Kawasan Lindung berfungsi mencegah kerusakan lingkungan menjaga keseimbangan ekosistem dan melestarikan sumber daya alam."}, {"no": 165, "soal": "Dokumen penyerta AMDAL yang memuat rencana konkret pengelolaan dan pemantauan dampak lingkungan hidup akibat kegiatan proyek dinamakan...", "options": [{"letter": "a", "text": "KA-ANDAL"}, {"letter": "b", "text": "RKL-RPL"}, {"letter": "c", "text": "SPPL"}, {"letter": "d", "text": "DELH"}, {"letter": "e", "text": "DPLH"}], "correct": "b", "pembahasan": "Jawaban B BENAR: RKL-RPL (Rencana Pengelolaan Lingkungan - Rencana Pemantauan Lingkungan) memuat prosedur rinci penanganan dan pemantauan dampak proyek."}, {"no": 166, "soal": "Prinsip Pembangunan Berbasis Komunitas (Community-Based Development) menekankan partisipasi warga sejak tahap perencanaan hingga pelaksanaan untuk mewujudkan...", "options": [{"letter": "a", "text": "Dominasi instansi pemerintah pusat"}, {"letter": "b", "text": "Kemandirian warga rasa kepemilikan (sense of ownership) dan keberlanjutan program"}, {"letter": "c", "text": "Efisiensi investasi modal asing semata"}, {"letter": "d", "text": "Pembongkaran permukiman secara cepat"}, {"letter": "e", "text": "Swastarisasi fasilitas umum"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Partisipasi aktif masyarakat lokal dalam perencanaan meningkatkan kemandirian dan rasa kepemilikan atas hasil pembangunan."}, {"no": 167, "soal": "Menurut standar SNI 03-1733-2004 1 unit Sekolah Dasar (SD) idealnya melayani ambang batas (threshold) 1.600 penduduk. Jika suatu kawasan berpenduduk 32.000 jiwa berapa jumlah unit SD yang dibutuhkan?", "options": [{"letter": "a", "text": "10 unit"}, {"letter": "b", "text": "15 unit"}, {"letter": "c", "text": "20 unit"}, {"letter": "d", "text": "25 unit"}, {"letter": "e", "text": "30 unit"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Jumlah SD = Populasi / Threshold = 32.000 / 1.600 = 20 unit."}, {"no": 168, "soal": "Fenomena penjalaran acak kawasan pinggiran (suburban sprawl) memberikan dampak negatif utama berupa...", "options": [{"letter": "a", "text": "Peningkatan penggunaan transportasi umum"}, {"letter": "b", "text": "Tingginya ketergantungan kendaraan pribadi dan pemborosan konsumsi lahan"}, {"letter": "c", "text": "Penurunan biaya operasional jaringan utilitas"}, {"letter": "d", "text": "Efisiensi tata guna lahan"}, {"letter": "e", "text": "Penurunan polusi udara"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Sprawl memicu konsumsi lahan pertanian berlebih inefisiensi utilitas dan tingginya ketergantungan pada mobil pribadi."}, {"no": 169, "soal": "Dokumen rencana rincian tata ruang kawasan pesisir dan laut yang diintegrasikan ke dalam RTRW Provinsi pasca-UU Cipta Kerja adalah...", "options": [{"letter": "a", "text": "RDTR"}, {"letter": "b", "text": "RZWP-3-K"}, {"letter": "c", "text": "RPJMD"}, {"letter": "d", "text": "AMDAL"}, {"letter": "e", "text": "RTRW Kabupaten"}], "correct": "b", "pembahasan": "Jawaban B BENAR: RZWP-3-K (Rencana Zonasi Wilayah Pesisir dan Pulau-Pulau Kecil) diintegrasikan ke dalam RTRW Provinsi sebagai bagian kesatuan darat-laut."}, {"no": 170, "soal": "Konsep Transit Adjacent Development (TAD) berbeda dari Transit Oriented Development (TOD) karena kawasan TAD...", "options": [{"letter": "a", "text": "Berada dekat simpul transit tetapi tidak dirancang terintegrasi dan ramah pejalan kaki"}, {"letter": "b", "text": "Memiliki akses stasiun terbaik di dunia"}, {"letter": "c", "text": "Tidak memiliki jalan raya"}, {"letter": "d", "text": "Seluruh gedungnya dihubungkan dengan skybridge"}, {"letter": "e", "text": "Berada jauh dari jaringan transit"}], "correct": "a", "pembahasan": "Jawaban A BENAR: TAD berada secara fisik dekat dengan simpul transit namun desain lahannya masih berorientasi mobil pribadi dan tidak ramah pedestrian."}, {"no": 171, "soal": "Dalam analisis Input-Output (I-O) koefisien yang mengukur total perubahan output di seluruh sektor ekonomi akibat perubahan 1 unit permintaan akhir pada sektor tertentu dinamakan...", "options": [{"letter": "a", "text": "Koefisien Gini"}, {"letter": "b", "text": "Angka Pengganda Output (Output Multiplier)"}, {"letter": "c", "text": "Indeks Williamson"}, {"letter": "d", "text": "Location Quotient"}, {"letter": "e", "text": "Elasticity Index"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Output Multiplier mengukur dampak langsung dan tidak langsung dari perubahan unit permintaan akhir terhadap total output perekonomian."}, {"no": 172, "soal": "Kota B memiliki jumlah penduduk 50.000 jiwa dengan total luas wilayah 10 km2. Berapakah kepadatan penduduk bruto (Gross Density) kota tersebut?", "options": [{"letter": "a", "text": "500 jiwa/km2"}, {"letter": "b", "text": "1.000 jiwa/km2"}, {"letter": "c", "text": "2.500 jiwa/km2"}, {"letter": "d", "text": "5.000 jiwa/km2"}, {"letter": "e", "text": "10.000 jiwa/km2"}], "correct": "d", "pembahasan": "Jawaban D BENAR: Kepadatan Bruto = 50.000 jiwa / 10 km2 = 5.000 jiwa/km2."}, {"no": 173, "soal": "Metode perencanaan partisipatif yang melibatkan masyarakat lokal secara langsung melalui pemetaan swadaya dan penilaian kondisi lingkungan dikenal sebagai...", "options": [{"letter": "a", "text": "Participatory Rural/Urban Appraisal (PRA/PUA)"}, {"letter": "b", "text": "Cost Benefit Analysis"}, {"letter": "c", "text": "Shift-Share Analysis"}, {"letter": "d", "text": "Input-Output Model"}, {"letter": "e", "text": "Regression Analysis"}], "correct": "a", "pembahasan": "Jawaban A BENAR: PRA/PUA adalah metode pendekatan partisipatif yang menempatkan warga sebagai subjek utama dalam mengenali masalah dan potensi lokal."}, {"no": 174, "soal": "Pendekatan perancangan kota karya Gordon Cullen yang menekankan pada persepsi visual urutan pemandangan (serial vision) dan pengalaman pejalan kaki dinamakan...", "options": [{"letter": "a", "text": "The Image of the City"}, {"letter": "b", "text": "The Concise Townscape"}, {"letter": "c", "text": "Death and Life of Great American Cities"}, {"letter": "d", "text": "Design with Nature"}, {"letter": "e", "text": "Responsive Environments"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Gordon Cullen (1961) menulis The Concise Townscape yang mengkaji hubungan lanskap kota berbasis analisis urutan visual pengamat."}, {"no": 175, "soal": "Strategi penataan ruang kota melalui pemanfaatan dan pembangunan kembali lahan-lahan kosong (vacant land) di dalam kawasan terbangun eksisting disebut...", "options": [{"letter": "a", "text": "Sub-urbanization"}, {"letter": "b", "text": "Infill Development"}, {"letter": "c", "text": "Leapfrog Development"}, {"letter": "d", "text": "Greenfield Development"}, {"letter": "e", "text": "Urban Sprawl"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Infill Development memanfaatkan persil/kantong lahan kosong di dalam kawasan perkotaan yang sudah terbangun guna mencegah sprawl."}, {"no": 176, "soal": "Suatu proyek infrastruktur air bersih memiliki Present Value Manfaat (PV Benefit) sebesar Rp 200 Miliar dan Present Value Biaya (PV Cost) sebesar Rp 160 Miliar. Nilai Net Present Value (NPV) proyek tersebut adalah...", "options": [{"letter": "a", "text": "Rp 20 Miliar"}, {"letter": "b", "text": "Rp 40 Miliar"}, {"letter": "c", "text": "Rp 160 Miliar"}, {"letter": "d", "text": "Rp 200 Miliar"}, {"letter": "e", "text": "Rp 360 Miliar"}], "correct": "b", "pembahasan": "Jawaban B BENAR: NPV = PV Benefit - PV Cost = 200 - 160 = Rp 40 Miliar."}, {"no": 177, "soal": "Dalam analisis daya dukung lahan kawasan dengan kemiringan lereng di atas 40% secara umum ditetapkan sebagai...", "options": [{"letter": "a", "text": "Kawasan permukiman kepadatan tinggi"}, {"letter": "b", "text": "Kawasan lindung / kawasan rawan bencana erosi"}, {"letter": "c", "text": "Kawasan industri berat"}, {"letter": "d", "text": "Kawasan pusat perdagangan"}, {"letter": "e", "text": "Kawasan persawahan irigasi teknis"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Kriteria kelerengan lereng >40% ditetapkan sebagai kawasan lindung untuk mencegah tanah longsor dan mengamankan fungsi resapan."}, {"no": 178, "soal": "Fenomena Backwash Effect dalam teori Gunnar Myrdal menjelaskan kondisi di mana keberadaan pusat pertumbuhan (growth pole)...", "options": [{"letter": "a", "text": "Menyalurkan kesejahteraan secara merata ke desa"}, {"letter": "b", "text": "Menarik modal sumber daya dan tenaga kerja dari daerah sekitarnya sehingga daerah sekitar tertinggal"}, {"letter": "c", "text": "Menghentikan kegiatan industri"}, {"letter": "d", "text": "Menghilangkan kesenjangan ekonomi"}, {"letter": "e", "text": "Memindahkan pusat pemerintahan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Backwash Effect memicu pengeringan sumber daya dari hinterland ke pusat pertumbuhan memperlebar ketimpangan wilayah."}, {"no": 179, "soal": "Kawasan yang ditetapkan dengan fungsi utama untuk dibudidayakan atas dasar kondisi dan potensi sumber daya alam SDM dan buatan dinamakan...", "options": [{"letter": "a", "text": "Kawasan Lindung"}, {"letter": "b", "text": "Kawasan Budidaya"}, {"letter": "c", "text": "Kawasan Konservasi"}, {"letter": "d", "text": "Kawasan Cagar Alam"}, {"letter": "e", "text": "Kawasan Rawan Bencana"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Kawasan Budidaya ditetapkan untuk kegiatan pemanfaatan produksi permukiman dan prasarana penunjang kegiatan manusia."}, {"no": 180, "soal": "Dalam sistem jaringan drainase perkotaan saluran yang menampung limpasan air dari saluran sekunder dan menyalurkannya menuju badan air penerima (sungai/laut) dinamakan...", "options": [{"letter": "a", "text": "Saluran Tersier"}, {"letter": "b", "text": "Saluran Sekunder"}, {"letter": "c", "text": "Saluran Primer"}, {"letter": "d", "text": "Saluran Lokal"}, {"letter": "e", "text": "Saluran Biopori"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Saluran Primer adalah saluran utama jaringan drainase yang menerima pasokan air dari saluran sekunder dan membuangnya ke badan air."}, {"no": 181, "soal": "Sebuah persil tanah memiliki luas 1.000 m2 dengan Koefisien Lantai Bangunan (KLB) sebesar 2,5. Berapakah luas total seluruh lantai bangunan maksimum yang dapat dibangun?", "options": [{"letter": "a", "text": "1.000 m2"}, {"letter": "b", "text": "1.500 m2"}, {"letter": "c", "text": "2.000 m2"}, {"letter": "d", "text": "2.500 m2"}, {"letter": "e", "text": "3.000 m2"}], "correct": "d", "pembahasan": "Jawaban D BENAR: Luas Lantai Maksimum = Luas Lahan x KLB = 1.000 m2 x 2,5 = 2.500 m2."}, {"no": 182, "soal": "Dalam teori struktur ruang kota Ernest Burgess (Teori Konsentris) lingkaran kedua yang mengelilingi Pusat Kegiatan Utama (CBD) dan dicirikan oleh daerah kumuh serta industri ringan dinamakan...", "options": [{"letter": "a", "text": "Commuter Zone"}, {"letter": "b", "text": "Zone in Transition"}, {"letter": "c", "text": "Workingmen's Homes Zone"}, {"letter": "d", "text": "Better Residences Zone"}, {"letter": "e", "text": "Central Business District"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Zone in Transition (Zona Peralihan) berada di antara CBD dan permukiman kelas pekerja ditandai percampuran fungsi industri dan permukiman kumuh."}, {"no": 183, "soal": "Peta Rencana Detail Tata Ruang (RDTR) Kabupaten/Kota wajib disusun dengan tingkat ketelitian skala peta minimal sebesar...", "options": [{"letter": "a", "text": "1 : 250.000"}, {"letter": "b", "text": "1 : 50.000"}, {"letter": "c", "text": "1 : 25.000"}, {"letter": "d", "text": "1 : 5.000"}, {"letter": "e", "text": "1 : 1.000"}], "correct": "d", "pembahasan": "Jawaban D BENAR: Sesuai aturan tata ruang Indonesia RDTR disusun sebagai peta operasional presisi tinggi dengan skala minimal 1:5.000."}, {"no": 184, "soal": "Teknik analisis kesesuaian lahan (Land Suitability Analysis) yang dipelopori oleh Ian McHarg melalui penumpangsusunan (overlay) peta tematik secara transparan dikenal dengan pendekatan...", "options": [{"letter": "a", "text": "Design with Nature"}, {"letter": "b", "text": "Garden City"}, {"letter": "c", "text": "Broadacre City"}, {"letter": "d", "text": "Industrial Town"}, {"letter": "e", "text": "Linear City"}], "correct": "a", "pembahasan": "Jawaban A BENAR: Ian McHarg mengagitasi metode Design with Nature (1969) yang menjadi cikal bakal teknik overlay GIS untuk analisis kesesuaian lingkungan."}, {"no": 185, "soal": "Instrumen rekayasa pertanahan di mana para pemilik tanah menyerahkan sebagian lahannya secara sukarela untuk pembangunan prasarana umum dan penataan kembali bentuk persil tanah dinamakan...", "options": [{"letter": "a", "text": "Land Clearance"}, {"letter": "b", "text": "Land Consolidation (Land Pooling)"}, {"letter": "c", "text": "Gentrification"}, {"letter": "d", "text": "Land Expropriation"}, {"letter": "e", "text": "Infill Development"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Konsolidasi Lahan (Land Pooling) menata kembali batas-batas persil tanah yang tidak teratur sekaligus menyediakan tapak infrastruktur umum tanpa penggusuran."}, {"no": 186, "soal": "Dalam teori struktur ruang Homer Hoyt (Teori Sektor) kawasan industri dan pergudangan cenderung berkembang dan memanjang mengikuti...", "options": [{"letter": "a", "text": "Garis pantai"}, {"letter": "b", "text": "Jalur transportasi utama (rel kereta api jalan arteri atau sungai)"}, {"letter": "c", "text": "Lingkaran terluar kota"}, {"letter": "d", "text": "Wilayah pegunungan"}, {"letter": "e", "text": "Wilayah pusat pemerintahan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Homer Hoyt menyatakan bahwa sektor industri dan perdagangan grosir bertumbuh secara linear mengikuti koridor utama transportasi."}, {"no": 187, "soal": "Suatu wilayah memiliki populasi usia non-produktif (0-14 tahun & >= 65 tahun) sebanyak 6.000 jiwa dan populasi usia produktif (15-64 tahun) sebanyak 10.000 jiwa. Berapakah Angka Beban Ketergantungan (Dependency Ratio) wilayah tersebut?", "options": [{"letter": "a", "text": "0.4"}, {"letter": "b", "text": "0.5"}, {"letter": "c", "text": "0.6"}, {"letter": "d", "text": "0.7"}, {"letter": "e", "text": "0.8"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Dependency Ratio = (Populasi Non-Produktif / Populasi Produktif) x 100% = (6.000 / 10.000) x 100% = 60%."}, {"no": 188, "soal": "Kawasan tangkapan pejalan kaki (Pedestrian Catchment Area) ideal dalam konsep pengembangan kawasan berorientasi transit (TOD) berkisar antara radius...", "options": [{"letter": "a", "text": "50-100 m"}, {"letter": "b", "text": "400-800 m"}, {"letter": "c", "text": "2-3 km"}, {"letter": "d", "text": "5-10 km"}, {"letter": "e", "text": "10-15 km"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Radius TOD ditetapkan 400-800 m (setara 5-10 menit berjalan kaki) dari stasiun transit utama."}, {"no": 189, "soal": "Kajian yang wajib dilakukan untuk menilai dampak pemanfaatan ruang terhadap bangkitan dan tarikan lalu lintas akibat pembangunan pusat kegiatan baru disebut...", "options": [{"letter": "a", "text": "AMDAL"}, {"letter": "b", "text": "KLHS"}, {"letter": "c", "text": "Analisis Dampak Lalu Lintas (Andalalin)"}, {"letter": "d", "text": "SPPL"}, {"letter": "e", "text": "UKL-UPL"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Andalalin memprediksi dan memberikan solusi mitigasi atas tambahan beban lalu lintas yang dipicu oleh pembangunan gedung/kawasan baru."}, {"no": 190, "soal": "Jarak minimum dari tepi luar kaki tanggul atau tepi sungai yang ditetapkan untuk menjaga kelestarian fungsi sungai dinamakan...", "options": [{"letter": "a", "text": "Garis Padempalan"}, {"letter": "b", "text": "Garis Sempadan Bangunan (GSB)"}, {"letter": "c", "text": "Garis Sempadan Sungai (GSS)"}, {"letter": "d", "text": "Garis Pantai"}, {"letter": "e", "text": "Koefisien Tapak"}], "correct": "c", "pembahasan": "Jawaban C BENAR: Garis Sempadan Sungai (GSS) adalah batas perlindungan kawasan sepanjang kiri-kanan sungai guna menjaga kelestarian fungsi badan air."}, {"no": 191, "soal": "Indeks statistik regional yang digunakan untuk mengukur tingkat ketimpangan pembangunan ekonomi antarwilayah dalam suatu negara disebut...", "options": [{"letter": "a", "text": "Indeks Gini"}, {"letter": "b", "text": "Indeks Williamson"}, {"letter": "c", "text": "Indeks Human Capital"}, {"letter": "d", "text": "Indeks Shannon-Wiener"}, {"letter": "e", "text": "Indeks Kebahagiaan"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Indeks Williamson memapar tingkat ketimpangan pembangunan ekonomi antar-wilayah/kabupaten berbasis PDRB per kapita dan jumlah penduduk."}, {"no": 192, "soal": "Menurut UU No. 26 Tahun 2007 tentang Penataan Ruang penyelenggaraan penataan ruang bertujuan untuk mewujudkan ruang wilayah nasional yang...", "options": [{"letter": "a", "text": "Kaya maju berteknologi dan mandiri"}, {"letter": "b", "text": "Aman nyaman produktif dan berkelanjutan"}, {"letter": "c", "text": "Padat komersial terindustrialisasi dan modern"}, {"letter": "d", "text": "Bebas pajak terintegrasi dan tertutup"}, {"letter": "e", "text": "Berbasis pertanian penuh dan terisolasi"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Pasal 3 UU No. 26/2007 menetapkan tujuan utama tata ruang Indonesia adalah mewujudkan ruang yang aman nyaman produktif dan berkelanjutan."}, {"no": 193, "soal": "Penduduk Kota C pada tahun 2020 adalah 100.000 jiwa dengan laju pertumbuhan aritmatika 2% per tahun (r = 0,02). Berapakah proyeksi jumlah penduduk Kota C pada tahun 2025 (t = 5 tahun)?", "options": [{"letter": "a", "text": "105.000 jiwa"}, {"letter": "b", "text": "108.000 jiwa"}, {"letter": "c", "text": "110.000 jiwa"}, {"letter": "d", "text": "112.000 jiwa"}, {"letter": "e", "text": "120.000 jiwa"}], "correct": "c", "pembahasan": "Jawaban C BENAR: P_t = P_0 (1 + r x t) = 100.000 x (1 + 0,02 x 5) = 100.000 x 1,10 = 110.000 jiwa."}, {"no": 194, "soal": "Konsep perencanaan kota Smart City secara umum ditopang o aban B BENAR: Mitigasi struktural melibatkan rekayasa fisik/konstruksi bangunan guna mengurangi risiko bahaya bencana."}, {"no": 198, "soal": "Jika lebar Rumaja (Rencana Milik Jalan) suatu jalan arteri adalah 10 meter batas minimum Garis Sempadan Bangunan (GSB) yang diukur dari as jalan umumnya bernilai sebesar...", "options": [{"letter": "a", "text": "2 meter"}, {"letter": "b", "text": "5 meter"}, {"letter": "c", "text": "10 meter"}, {"letter": "d", "text": "15 meter"}, {"letter": "e", "text": "20 meter"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Ketentuan baku GSB untuk persil bangunan depan umumnya bernilai 1/2 x lebar jalan (dihitung dari as jalan atau garis tepi jalan)."}, {"no": 199, "soal": "Rencana Tata Ruang Wilayah (RTRW) Kabupaten/Kota memiliki jangka waktu berlaku selama...", "options": [{"letter": "a", "text": "5 tahun"}, {"letter": "b", "text": "10 tahun"}, {"letter": "c", "text": "15 tahun"}, {"letter": "d", "text": "20 tahun"}, {"letter": "e", "text": "25 tahun"}], "correct": "d", "pembahasan": "Jawaban D BENAR: Dokumen RTRW Nasional Provinsi maupun Kabupaten/Kota berlaku untuk jangka waktu 20 tahun dan dievaluasi 5 tahun sekali."}, {"no": 200, "soal": "Konsep kawasan perkotaan terpadu yang memadukan fasilitas riset perguruan tinggi industri teknologi tinggi dan permukiman modern dinamakan...", "options": [{"letter": "a", "text": "Agropolitan"}, {"letter": "b", "text": "Technopolis"}, {"letter": "c", "text": "Metropolis"}, {"letter": "d", "text": "Desakota"}, {"letter": "e", "text": "Megacity"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Technopolis adalah kawasan perkotaan berbasis inovasi teknologi yang mengintegrasikan kampus riset industri komersial canggih dan hunian."}, {"no": 201, "soal": "Konsep kawasan perkotaan terpadu yang memadukan fasilitas riset perguruan tinggi industri teknologi tinggi dan permukiman modern dinamakan...", "options": [{"letter": "a", "text": "Agropolitan"}, {"letter": "b", "text": "Technopolis"}, {"letter": "c", "text": "Metropolis"}, {"letter": "d", "text": "Desakota"}, {"letter": "e", "text": "Megacity"}], "correct": "b", "pembahasan": "Jawaban B BENAR: Technopolis adalah kawasan perkotaan berbasis inovasi teknologi yang mengintegrasikan kampus riset industri komersial canggih dan hunian."}]</script>
<script>
  const QUESTIONS = JSON.parse(document.getElementById('questionData').textContent);
  const TOTAL = QUESTIONS.length;

  // status: 0 = unanswered(kuning), 1 = correct(hijau), 2 = wrong(merah)
  let status = new Array(TOTAL).fill(0);
  let chosenLetter = new Array(TOTAL).fill(null);
  let current = 0;

  const pagesWrap = document.getElementById('pagesWrap');
  const startBtn = document.getElementById('startBtn');
  const backBtn = document.getElementById('backBtn');

  const soalText = document.getElementById('soalText');
  const optionsList = document.getElementById('optionsList');
  const feedback = document.getElementById('feedback');
  const verdict = document.getElementById('verdict');
  const pembBody = document.getElementById('pembBody');
  const counter = document.getElementById('counter');
  const scoreCorrect = document.getElementById('scoreCorrect');
  const scoreWrong = document.getElementById('scoreWrong');
  const scoreUnanswered = document.getElementById('scoreUnanswered');
  const navGrid = document.getElementById('navGrid');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function goToQuiz() { pagesWrap.classList.add('on-quiz'); }
  function goToCover() { pagesWrap.classList.remove('on-quiz'); }
  startBtn.addEventListener('click', goToQuiz);
  backBtn.addEventListener('click', goToCover);

  // swipe support
  let touchStartX = null;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) {
      if (dx < 0) goToQuiz(); else goToCover();
    }
    touchStartX = null;
  }, {passive:true});

  function buildNavGrid() {
    navGrid.innerHTML = '';
    QUESTIONS.forEach((q, i) => {
      const b = document.createElement('button');
      b.className = 'nav-btn st-yellow';
      b.textContent = q.no;
      b.dataset.idx = i;
      b.addEventListener('click', () => renderQuestion(i));
      navGrid.appendChild(b);
    });
  }

  function updateNavGrid() {
    const btns = navGrid.querySelectorAll('.nav-btn');
    btns.forEach((b, i) => {
      b.classList.remove('st-yellow', 'st-green', 'st-red', 'current');
      if (status[i] === 1) b.classList.add('st-green');
      else if (status[i] === 2) b.classList.add('st-red');
      else b.classList.add('st-yellow');
      if (i === current) b.classList.add('current');
    });
  }

  function updateStats() {
    const correctCount = status.filter(s => s === 1).length;
    const wrongCount = status.filter(s => s === 2).length;
    const unansweredCount = TOTAL - correctCount - wrongCount;
    scoreCorrect.textContent = correctCount;
    scoreWrong.textContent = wrongCount;
    scoreUnanswered.textContent = unansweredCount;
    counter.textContent = `Soal ${current + 1} dari ${TOTAL}`;
  }

  function renderQuestion(i) {
    current = i;
    const q = QUESTIONS[i];
    soalText.textContent = q.soal;
    optionsList.innerHTML = '';
    feedback.className = 'feedback';

    q.options.forEach(opt => {
      const li = document.createElement('li');
      li.className = 'option';
      li.dataset.letter = opt.letter;
      li.innerHTML = `<span class="letter">${opt.letter.toUpperCase()}</span><span class="opt-text">${opt.text}</span>`;
      li.addEventListener('click', () => handleAnswer(opt.letter));
      optionsList.appendChild(li);
    });

    if (status[i] !== 0) {
      revealAnswer(chosenLetter[i]);
    }

    prevBtn.disabled = (i === 0);
    nextBtn.textContent = (i === TOTAL - 1) ? 'Selesai' : 'Berikutnya \u2192';

    updateStats();
    updateNavGrid();
    scrollCurrentIntoView();
  }

  function scrollCurrentIntoView() {
    const el = navGrid.querySelector('.nav-btn.current');
    if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function handleAnswer(letter) {
    const i = current;
    if (status[i] !== 0) return; // already answered, locked
    const q = QUESTIONS[i];
    const isCorrect = letter === q.correct;
    status[i] = isCorrect ? 1 : 2;
    chosenLetter[i] = letter;
    revealAnswer(letter);
    updateStats();
    updateNavGrid();
  }

  function revealAnswer(chosen) {
    const q = QUESTIONS[current];
    const opts = optionsList.querySelectorAll('.option');
    opts.forEach(li => {
      li.classList.add('locked');
      if (li.dataset.letter === q.correct) {
        li.classList.add('correct');
      } else if (chosen && li.dataset.letter === chosen) {
        li.classList.add('wrong');
      } else {
        li.classList.add('dim');
      }
    });

    const isCorrect = status[current] === 1;
    feedback.classList.add('show', isCorrect ? 'is-correct' : 'is-wrong');
    verdict.textContent = isCorrect ? 'Benar.' : 'Kurang tepat.';

    if (q.pembahasan && q.pembahasan.trim().length > 0) {
      pembBody.textContent = q.pembahasan;
      pembBody.classList.remove('no-pemb');
    } else {
      pembBody.textContent = 'Tidak ada catatan pembahasan untuk soal ini.';
      pembBody.classList.add('no-pemb');
    }
  }

  prevBtn.addEventListener('click', () => { if (current > 0) renderQuestion(current - 1); });
  nextBtn.addEventListener('click', () => {
    if (current < TOTAL - 1) renderQuestion(current + 1);
    else goToCover();
  });

  buildNavGrid();
  renderQuestion(0);
</script>
</body>
</html>
